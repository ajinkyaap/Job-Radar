name: Daily Job Radar
on:
  schedule:
    # 10:00, 13:00 and 21:00 IST = 04:30, 07:30 and 15:30 UTC
    - cron: '30 4,7,15 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: job-radar-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Write runtime secrets
        shell: bash
        run: |
          printf '%s' '${{ secrets.JOB_RADAR_CONFIG_B64 }}' | base64 --decode > config.yaml
          printf '%s' '${{ secrets.JOB_RADAR_CREDENTIALS_B64 }}' | base64 --decode > credentials.json
      - name: Enforce India schedule window
        run: python schedule_guard.py
      - run: python main.py
