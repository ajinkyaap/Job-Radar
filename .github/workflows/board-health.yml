name: ATS Board Health
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: cloud}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python verify_boards.py
